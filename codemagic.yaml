workflows:
  ios-unsigned:
    name: iOS Unsigned Debug
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Prepare iOS build
        script: |
          set -e
          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned IPA
        script: |
          set -e
          flutter build ios --debug --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Verify IPA exists
        script: |
          echo "Checking for IPA..."
          ls -la build/ios/iphoneos/
          if [ -f build/ios/iphoneos/Runner.ipa ]; then
            echo "IPA found!"
          else
            echo "IPA NOT found - listing build directory:"
            find build/ios -name "*.app" -o -name "*.ipa"
            exit 1
          fi
    artifacts:
      - build/ios/iphoneos/Runner.ipa